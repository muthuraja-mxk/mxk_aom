name: AOM CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aom-dev-deployment
  cancel-in-progress: false

env:
  DEPLOY_ENV: dev
  COMPOSE_FILE: "docker-compose dev.yaml"

jobs:

  # ==========================================
  # STAGE 1 - FRONTEND BUILD
  # ==========================================
  frontend-build:
    name: "Stage 1 - Frontend Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  # ==========================================
  # STAGE 2 - BACKEND BUILD
  # ==========================================
  backend-build:
    name: "Stage 2 - Laravel Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql
          coverage: none

      - name: Validate Composer
        working-directory: backend
        run: composer validate --no-check-publish

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-scripts

  # ==========================================
  # STAGE 3 - UNIT TESTS
  # ==========================================
  unit-test:
    name: "Stage 3 - Unit Testing"
    needs:
      - frontend-build
      - backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql
          coverage: none

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-scripts

      - name: Prepare Laravel Test Environment
        working-directory: backend
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache
          php artisan key:generate --force
          php artisan package:discover --ansi

      - name: Run Laravel Tests
        working-directory: backend
        run: php artisan test

  # ==========================================
  # STAGE 4 - DOCKER BUILD
  # ==========================================
  docker-build:
    name: "Stage 4 - Docker Build"
    needs:
      - unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker Compose File
        run: |
          test -f "$COMPOSE_FILE"
          echo "Using DEV Compose file: $COMPOSE_FILE"

      - name: Validate DEV Compose Configuration
        run: |
          docker compose -f "$COMPOSE_FILE" config --quiet

      - name: Build DEV Docker Images
        run: |
          docker compose -f "$COMPOSE_FILE" build backend frontend

  # ==========================================
  # STAGE 5 - DEPLOY TO EC2 DEV
  # ==========================================
  deploy:
    name: "Stage 5 - Deploy DEV"
    needs:
      - docker-build
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create SSH Key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Deploy Application
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e

          ssh \
            -o StrictHostKeyChecking=no \
            -i ec2-key.pem \
            "$EC2_USER@$EC2_HOST" << 'EOF'

              set -e

              cd /home/ubuntu/mxk_aom

              COMPOSE_FILE="docker-compose dev.yaml"

              echo "=================================="
              echo "Starting DEV deployment"
              echo "=================================="

              echo "Pulling latest code..."
              git pull --ff-only origin main

              echo "Checking DEV Compose file..."
              test -f "$COMPOSE_FILE"

              echo "Validating DEV configuration..."
              docker compose -f "$COMPOSE_FILE" config --quiet

              echo "Building updated application images..."
              docker compose -f "$COMPOSE_FILE" build backend frontend

              echo "Recreating DEV application containers..."
              docker compose -f "$COMPOSE_FILE" up -d \
                --no-deps \
                --force-recreate \
                backend frontend

              echo "Waiting for application startup..."
              sleep 10

              echo "DEV container status:"
              docker compose -f "$COMPOSE_FILE" ps

              echo "DEV deployment commands completed."

          EOF

      - name: Remove SSH Key
        if: always()
        run: rm -f ec2-key.pem

  # ==========================================
  # STAGE 6 - SMOKE TEST
  # ==========================================
  smoke-test:
    name: "Stage 6 - DEV Health Check"
    needs:
      - deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check Frontend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-connrefused \
            "http://${EC2_HOST}:3001"

      - name: Check Backend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-connrefused \
            "http://${EC2_HOST}:8000"

      - name: Deployment Successful
        run: |
          echo "=================================="
          echo "AOM DEV deployment successful"
          echo "Environment: $DEPLOY_ENV"
          echo "=================================="
