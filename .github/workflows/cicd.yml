name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ==================================================
  # STAGE 1 - CHECKOUT
  # ==================================================

  checkout:
    name: "Stage 1 - Checkout"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


  # ==================================================
  # STAGE 2 - FRONTEND INSTALL & BUILD
  # ==================================================

  frontend-build:
    name: "Stage 2 - Frontend Build"
    needs: checkout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        run: npm run build


  # ==================================================
  # STAGE 3 - BACKEND INSTALL
  # ==================================================

  backend-build:
    name: "Stage 3 - Laravel Build"
    needs: checkout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql
          coverage: none

      - name: Check PHP Version
        run: php -v

      - name: Check Composer Version
        run: composer --version

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --no-check-publish

      - name: Prepare Laravel Directories
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache
          chmod -R 775 bootstrap/cache

      - name: Install Composer Dependencies
        working-directory: backend
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-scripts

      - name: Laravel Package Discovery
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache
          chmod -R 775 bootstrap/cache
          php artisan package:discover --ansi


  # ==================================================
  # STAGE 4 - UNIT TEST
  # ==================================================

  unit-test:
    name: "Stage 4 - Unit Testing"
    needs:
      - frontend-build
      - backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------
      # Backend Tests
      # ------------------------------

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql
          coverage: none

      - name: Check PHP Version
        run: php -v

      - name: Check Composer Version
        run: composer --version

      - name: Prepare Laravel Directories
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache
          chmod -R 775 bootstrap/cache

      - name: Install Composer Dependencies
        working-directory: backend
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-scripts

            - name: Laravel Package Discovery
        working-directory: backend
        run: |
          php artisan package:discover --ansi

      - name: Check ExampleTest File
        working-directory: backend
        run: |
          echo "===== ExampleTest.php ====="
          cat tests/Unit/ExampleTest.php
          echo "===== End File ====="

      - name: Run Unit Tests
        working-directory: backend
        run: php vendor/bin/phpunit

      # ------------------------------
      # Frontend Tests
      # ------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Test
        working-directory: frontend
        run: echo "Frontend tests not configured yet - skipping"


  # ==================================================
  # STAGE 5 - DOCKER BUILD
  # ==================================================

  docker-build:
    name: "Stage 5 - Docker Build"
    needs:
      - frontend-build
      - backend-build
      - unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Version
        run: docker --version

      - name: Docker Compose Version
        run: docker compose version

      - name: Build Docker Images
        run: |
          docker compose build --no-cache


  # ==================================================
  # STAGE 6 - DEPLOY TO EC2
  # ==================================================

  deploy:
    name: "Stage 6 - Deploy to EC2"
    needs:
      - docker-build
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Deploy Application
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ec2-key.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          cd /home/ubuntu/mxk_aom

          git pull origin main

          docker compose down

          docker compose build --no-cache

          docker compose up -d

          docker compose ps

          EOF

      - name: Remove SSH Key
        if: always()
        run: |
          rm -f ec2-key.pem


  # ==================================================
  # STAGE 7 - SMOKE TEST
  # ==================================================

  smoke-test:
    name: "Stage 7 - Smoke Test"
    needs:
      - deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check Frontend
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:3001

      - name: Check Backend
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8000

      - name: Deployment Successful
        run: |
          echo "Application deployed successfully!"