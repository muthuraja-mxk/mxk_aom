name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod


jobs:

  # ==================================================
  # STAGE 1 - CHECKOUT
  # ==================================================

  checkout:
    name: "Stage 1 - Checkout"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


  # ==================================================
  # STAGE 2 - FRONTEND INSTALL & BUILD
  # ==================================================

  frontend-build:
    name: "Stage 2 - Frontend Build"
    needs: checkout
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        run: npm run build


  # ==================================================
  # STAGE 3 - BACKEND INSTALL
  # ==================================================

  backend-build:
    name: "Stage 3 - Laravel Build"
    needs: checkout
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql
          coverage: none

      - name: Check PHP Version
        run: php -v

      - name: Check Composer Version
        run: composer --version

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --no-check-publish

      - name: Prepare Laravel Directories
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache
          chmod -R 775 bootstrap/cache

      - name: Install Composer Dependencies
        working-directory: backend
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-scripts

      - name: Laravel Package Discovery
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache
          chmod -R 775 bootstrap/cache
          php artisan package:discover --ansi


  # ==================================================
  # STAGE 4 - UNIT TEST
  # ==================================================

  unit-test:
    name: "Stage 4 - Unit Testing"
    needs:
      - frontend-build
      - backend-build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      # ----------------------------------------------
      # Backend Tests
      # ----------------------------------------------

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql
          coverage: none

      - name: Check PHP Version
        run: php -v

      - name: Check Composer Version
        run: composer --version

      - name: Install Composer Dependencies
        working-directory: backend
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-scripts

      - name: Prepare Laravel Environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Laravel Package Discovery
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache
          chmod -R 775 bootstrap/cache
          php artisan package:discover --ansi

      - name: Run Unit Tests
        working-directory: backend
        run: php vendor/bin/pest


      # ----------------------------------------------
      # Frontend Tests
      # ----------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Test
        working-directory: frontend
        run: echo "Frontend tests not configured yet - skipping"


  # ==================================================
  # STAGE 5 - DEPLOY TO EC2
  # ==================================================

  deploy:
    name: "Stage 5 - Deploy to EC2"

    needs:
      - unit-test

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:

      # ----------------------------------------------
      # Checkout
      # ----------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ----------------------------------------------
      # Create SSH Key
      # ----------------------------------------------

      - name: Create SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2-key.pem
          chmod 600 ec2-key.pem


      # ----------------------------------------------
      # Deploy Application
      # ----------------------------------------------

      - name: Deploy Application
        run: |

          # ==========================================
          # Select Environment
          # ==========================================

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ inputs.environment }}"
          else
            ENVIRONMENT="prod"
          fi

          echo "=========================================="
          echo "Deploying Environment: $ENVIRONMENT"
          echo "=========================================="


          # ==========================================
          # SSH Into EC2
          # ==========================================

          ssh -o StrictHostKeyChecking=no \
            -i ec2-key.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << EOF


          # ==========================================
          # Go To Application Directory
          # ==========================================

          cd /home/ubuntu/mxk_aom


          # ==========================================
          # Show Environment
          # ==========================================

          echo "=========================================="
          echo "Environment: $ENVIRONMENT"
          echo "=========================================="


          # ==========================================
          # Pull Latest Code
          # ==========================================

          echo "Pulling latest code..."

          git pull origin main


          # ==========================================
          # Validate Docker Compose
          # ==========================================

          echo "Validating Docker Compose..."

          docker compose \
            -f docker/docker-compose.yml \
            -f docker/$ENVIRONMENT/docker-compose.yml \
            config


          # ==========================================
          # Stop Existing Containers
          # ==========================================

          echo "Stopping existing containers..."

          docker compose \
            -f docker/docker-compose.yml \
            -f docker/$ENVIRONMENT/docker-compose.yml \
            down


          # ==========================================
          # Build Docker Images
          # ==========================================

          echo "Building Docker images..."

          docker compose \
            -f docker/docker-compose.yml \
            -f docker/$ENVIRONMENT/docker-compose.yml \
            build


          # ==========================================
          # Start Application
          # ==========================================

          echo "Starting application..."

          docker compose \
            -f docker/docker-compose.yml \
            -f docker/$ENVIRONMENT/docker-compose.yml \
            up -d


          # ==========================================
          # Container Status
          # ==========================================

          echo "Checking container status..."

          docker compose \
            -f docker/docker-compose.yml \
            -f docker/$ENVIRONMENT/docker-compose.yml \
            ps


          # ==========================================
          # Deployment Complete
          # ==========================================

          echo "=========================================="
          echo "Deployment completed successfully!"
          echo "Environment: $ENVIRONMENT"
          echo "=========================================="


          EOF


      # ----------------------------------------------
      # Remove SSH Key
      # ----------------------------------------------

      - name: Remove SSH Key
        if: always()
        run: |
          rm -f ec2-key.pem


  # ==================================================
  # STAGE 6 - SMOKE TEST
  # ==================================================

  smoke-test:
    name: "Stage 6 - Smoke Test"

    needs:
      - deploy

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------
      # Frontend Check
      # ----------------------------------------------

      - name: Check Frontend
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:3001


      # ----------------------------------------------
      # Backend Check
      # ----------------------------------------------

      - name: Check Backend
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8000


      # ----------------------------------------------
      # Success
      # ----------------------------------------------

      - name: Deployment Successful
        run: |
          echo "=========================================="
          echo "Application deployed successfully!"
          echo "=========================================="