services:

  db:
    image: mysql:9.0
    container_name: app_mysql_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_secret
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - db_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot_password_secret || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app-network-prod

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: app_laravel_backend_prod
    restart: always
    environment:
      APP_NAME: "Laravel 13 REST API"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "https://your-domain.com"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: app_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password

      FRONTEND_URL: "https://your-domain.com"

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app-network-prod

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: app_nextjs_frontend_prod
    restart: always
    environment:
      NEXT_PUBLIC_BACKEND_API_URL: "https://your-domain.com/api"
      NODE_ENV: production

    ports:
      - "3001:3000"

    depends_on:
      - backend

    networks:
      - app-network-prod

networks:
  app-network-prod:
    driver: bridge

volumes:
  db_data_prod:
    driver: local