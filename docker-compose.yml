services:
  # MySQL 9.7 Database Service
  db:
    image: mysql:9.0
    container_name: app_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_secret
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot_password_secret || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app-network

  # Backend REST API Service (Laravel 13 on PHP 8.4)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_laravel_backend
    restart: always
    environment:
      APP_NAME: "Laravel 13 REST API"
      APP_ENV: local
      APP_KEY: "base64:c9e6+7uU/X8/pS/6p3sR2T2+QJ5N8n7L0N6V7g8b9c0="
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: app_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      FRONTEND_URL: "http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # Frontend Web Service (Next.js 16.3 on Node 26)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_nextjs_frontend
    restart: always
    environment:
      NEXT_PUBLIC_BACKEND_API_URL: "http://localhost:8000"
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    driver: local
